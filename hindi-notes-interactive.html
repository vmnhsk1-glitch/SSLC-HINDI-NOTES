<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>हिंदी नोटबुक — SSLC रिवीज़न</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EA;
    --paper:#FFFDF7;
    --ink:#2B2A63;
    --saffron:#FF7A30;
    --leaf:#2F9E44;
    --coral:#FF5D6C;
    --gold:#FFB93C;
    --sky:#2E8BC0;
    --line:#EADFC4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 10%, #FFF1D6 0%, transparent 40%),
      radial-gradient(circle at 90% 20%, #E7F6EC 0%, transparent 45%),
      var(--cream);
    font-family:'Noto Sans Devanagari','Poppins',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  header.top{
    padding:28px 20px 18px;
    text-align:center;
    position:relative;
  }
  header.top .badge{
    display:inline-block;
    font-family:'Poppins';
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    background:var(--ink);
    color:#fff;
    padding:5px 14px;
    border-radius:20px;
    margin-bottom:10px;
  }
  h1.brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(30px,6vw,46px);
    margin:0 0 6px;
    color:var(--ink);
    line-height:1.1;
  }
  h1.brand span{color:var(--saffron);}
  header.top p.tag{
    font-family:'Poppins';
    color:#6b6890;
    font-size:14px;
    margin:0;
  }

  .search-wrap{
    max-width:520px;
    margin:22px auto 6px;
    padding:0 20px;
  }
  #search{
    width:100%;
    padding:13px 18px;
    border-radius:16px;
    border:2px solid var(--line);
    background:var(--paper);
    font-family:'Noto Sans Devanagari';
    font-size:16px;
    outline:none;
    transition:border-color .2s;
  }
  #search:focus{border-color:var(--saffron);}

  main{max-width:1100px;margin:0 auto;padding:10px 20px;}

  /* ---- HOME GRID ---- */
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;
    margin-top:22px;
  }
  .tile{
    position:relative;
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:16px 16px 4px 16px;
    padding:18px 16px 16px;
    cursor:pointer;
    text-align:left;
    transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 2px 0 rgba(0,0,0,0.04);
  }
  .tile::after{
    content:"";
    position:absolute;
    top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 22px 22px 0;
    border-color:transparent var(--cream) transparent transparent;
    border-radius:0 16px 0 0;
    filter:drop-shadow(-1px 1px 1px rgba(0,0,0,0.06));
  }
  .tile:nth-child(6n+1){transform:rotate(-1.1deg);}
  .tile:nth-child(6n+2){transform:rotate(0.8deg);}
  .tile:nth-child(6n+3){transform:rotate(-0.5deg);}
  .tile:nth-child(6n+4){transform:rotate(1.2deg);}
  .tile:nth-child(6n+5){transform:rotate(-1.4deg);}
  .tile:nth-child(6n+6){transform:rotate(0.5deg);}
  .tile:hover{transform:scale(1.045) rotate(0deg); box-shadow:0 10px 18px rgba(43,42,99,0.15);}
  .tile .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;height:30px;
    border-radius:50%;
    color:#fff;
    font-family:'Poppins';
    font-weight:700;
    font-size:13px;
    margin-bottom:10px;
  }
  .tile .icon{font-size:26px;margin-bottom:6px;display:block;}
  .tile h3{
    font-family:'Baloo 2';
    font-size:18px;
    margin:2px 0 8px;
    line-height:1.25;
    color:var(--ink);
  }
  .tile .count{
    font-family:'Poppins';
    font-size:11.5px;
    color:#8a87a8;
  }
  .tile.hidden{display:none;}

  .empty-msg{
    text-align:center;
    color:#9a97b8;
    font-family:'Poppins';
    padding:40px 10px;
    display:none;
  }

  /* ---- DETAIL VIEW ---- */
  #detail{display:none;}
  .backbtn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:24px;
    font-family:'Poppins';
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .backbtn:hover{opacity:0.88;}
  .detail-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .detail-head .icon-big{
    font-size:38px;
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:18px;
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .detail-head h2{
    font-family:'Baloo 2';
    font-size:clamp(22px,4vw,30px);
    margin:0;
    color:var(--ink);
  }
  .detail-head .sub{
    font-family:'Poppins';
    font-size:12.5px;
    color:#8a87a8;
    margin-top:2px;
  }

  .progress-bar{
    height:10px;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
    margin:14px 0 24px;
  }
  .progress-bar > div{
    height:100%;
    background:linear-gradient(90deg,var(--saffron),var(--gold));
    width:0%;
    transition:width .3s ease;
  }
  .hint-row{
    font-family:'Poppins';
    font-size:12.5px;
    color:#8a87a8;
    margin-bottom:16px;
  }

  #cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;
  }
  .flashcard{
    perspective:1200px;
    min-height:160px;
    cursor:pointer;
  }
  .flashcard .inner{
    position:relative;
    width:100%;height:100%;
    min-height:160px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    border-radius:16px;
  }
  .flashcard.flipped .inner{transform:rotateY(180deg);}
  .flashcard .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:16px;
    padding:18px;
    display:flex;
    flex-direction:column;
  }
  .flashcard .front{
    background:var(--paper);
    border:2px solid var(--line);
    justify-content:space-between;
  }
  .flashcard.done .front{border-color:var(--leaf);}
  .flashcard .qnum{
    font-family:'Poppins';
    font-weight:700;
    font-size:11px;
    color:#fff;
    background:var(--saffron);
    align-self:flex-start;
    padding:3px 10px;
    border-radius:12px;
    margin-bottom:10px;
  }
  .flashcard .qtext{
    font-family:'Noto Sans Devanagari';
    font-weight:600;
    font-size:15.5px;
    line-height:1.5;
    color:var(--ink);
    flex:1;
  }
  .flashcard .tapme{
    font-family:'Poppins';
    font-size:11px;
    color:#b3b0cc;
    margin-top:10px;
    text-align:right;
  }
  .flashcard .back{
    background:linear-gradient(160deg,#2B2A63,#3d3b82);
    color:#fff;
    transform:rotateY(180deg);
    overflow-y:auto;
  }
  .flashcard .back ul{
    margin:4px 0 0;
    padding-left:18px;
    font-size:14px;
    line-height:1.6;
  }
  .flashcard .back li{margin-bottom:5px;}
  .flashcard .back .backlabel{
    font-family:'Poppins';
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#FFD98C;
    margin-bottom:6px;
  }

  .letter-box, .essay-box{
    background:#fff;
    border:2px dashed var(--line);
    border-radius:14px;
    padding:16px 18px;
    font-size:14.5px;
    line-height:1.75;
    white-space:pre-line;
  }

  footer{
    text-align:center;
    font-family:'Poppins';
    font-size:11.5px;
    color:#b3b0cc;
    margin-top:50px;
  }
</style>
</head>
<body>

<header class="top">
  <span class="badge">Kannada Board · SSLC</span>
  <h1 class="brand">हिंदी <span>नोटबुक</span> 📖</h1>
  <p class="tag">कार्ड को टैप करो, जवाब देखो, याद करो — मज़े से पढ़ो!</p>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="🔍 पाठ खोजो... जैसे 'गिल्लू' या 'रोबोट'">
</div>

<main>
  <div id="grid"></div>
  <p class="empty-msg" id="emptyMsg">कुछ नहीं मिला 🙈 दूसरा शब्द आज़माओ</p>

  <div id="detail">
    <button class="backbtn" onclick="showHome()">⟵ सभी पाठ</button>
    <div class="detail-head">
      <div class="icon-big" id="dIcon"></div>
      <div>
        <h2 id="dTitle"></h2>
        <div class="sub" id="dSub"></div>
      </div>
    </div>
    <div class="progress-bar"><div id="dProgress"></div></div>
    <div class="hint-row">👉 कार्ड पर टैप करो, जवाब उलट कर दिखेगा</div>
    <div id="cards"></div>
  </div>
</main>

<footer>Prakash H.R, Assistant Teacher · K.P.S I.K Colony, Koratagere — बनाया गया रिवीज़न मज़ेदार बनाने के लिए ✨</footer>

<script>

const CHAPTERS = [
{num:1, title:"मातृभूमि", icon:"🌍", questions:[
  {q:"भारत माता के प्राकृतिक सौंदर्य का वर्णन करो", a:["भारत भूमि के खेत हरे-भरे हैं","वन-उपवन फल-फूलों से युक्त है","खनिज संपदा से भरा है","प्रकृति बड़ी आकर्षक है"]},

{num:4, title:"अभिनव मनुष्य", icon:"🤝", questions:[

{num:5, title:"मेरा बचपन", icon:"👦", questions:[
  {q:"आशियम्मा अब्दुल कलाम को खाने में क्या-क्या देती थीं?", a:["रसोई में केले के पत्ते बिछातीं","चावल-सांबर डालतीं, घर का अचार","नारियल की चटनी देती थीं"]},
  {q:"जैनुलाब्दीन नमाज़ की प्रासंगिकता के बारे में क्या कहते थे?", a:["नमाज़ पढ़ने से शरीर ब्रह्मांड का हिस्सा बन जाता है","इसमें दौलत, आयु, जाति, धर्म का भेद-भाव नहीं रहता"]},

let currentChapter = null;
let revealedSets = {};

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  CHAPTERS.forEach((ch, idx) => {
    const color = COLORS[idx % COLORS.length];
    const div = document.createElement('div');
    div.className = 'tile';
    div.dataset.search = (ch.title + ' ' + ch.questions.map(q=>q.q).join(' ')).toLowerCase();
    div.onclick = () => openChapter(ch.num);
    div.innerHTML = `
      <span class="num" style="background:${color}">${ch.num}</span>
      <span class="icon">${ch.icon}</span>
      <h3>${ch.title}</h3>
      <div class="count">${ch.questions.length} कार्ड</div>
    `;
    grid.appendChild(div);
  });
}

function openChapter(num){
  currentChapter = CHAPTERS.find(c => c.num === num);
  if(!revealedSets[num]) revealedSets[num] = new Set();
  document.getElementById('grid').style.display = 'none';
  document.querySelector('.search-wrap').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('dIcon').textContent = currentChapter.icon;
  document.getElementById('dTitle').textContent = currentChapter.num + '. ' + currentChapter.title;
  document.getElementById('dSub').textContent = currentChapter.questions.length + ' प्रश्न · पाठ ' + currentChapter.num;
  renderCards();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderCards(){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  const idx = CHAPTERS.indexOf(currentChapter);
  const color = COLORS[idx % COLORS.length];

  currentChapter.questions.forEach((item, i) => {
    const card = document.createElement('div');
    if(currentChapter.isLetter || currentChapter.isEssay){
      const box = document.createElement('div');
      box.style.gridColumn = '1 / -1';
      const bodyText = item.letter || item.essay;
      box.innerHTML = `<div class="qnum" style="background:${color};display:inline-block;margin-bottom:10px;">प्रश्न ${i+1}</div>
        <div class="qtext" style="margin-bottom:12px;">${item.q}</div>
        <div class="${currentChapter.isLetter ? 'letter-box' : 'essay-box'}">${bodyText}</div>`;
      wrap.appendChild(box);
      return;
    }
    card.className = 'flashcard';
    if(revealedSets[currentChapter.num].has(i)) card.classList.add('flipped','done');
    card.onclick = () => {
      card.classList.toggle('flipped');
      if(card.classList.contains('flipped')){
        revealedSets[currentChapter.num].add(i);
        card.classList.add('done');
      }
      updateProgress();
    };
    const bulletList = item.a.map(line => `<li>${line}</li>`).join('');
    card.innerHTML = `
      <div class="inner">
        <div class="face front">
          <div class="qnum" style="background:${color}">प्रश्न ${i+1}</div>
          <div class="qtext">${item.q}</div>
          <div class="tapme">👆 टैप करो</div>
        </div>
        <div class="face back">
          <div class="backlabel">जवाब</div>
          <ul>${bulletList}</ul>
        </div>
      </div>
    `;
    wrap.appendChild(card);
  });
  updateProgress();
}

function updateProgress(){
  if(currentChapter.isLetter || currentChapter.isEssay){
    document.getElementById('dProgress').style.width = '100%';
    return;
  }
  const total = currentChapter.questions.length;
  const done = revealedSets[currentChapter.num].size;
  document.getElementById('dProgress').style.width = (done/total*100) + '%';
}

function showHome(){
  document.getElementById('detail').style.display = 'none';
  document.getElementById('grid').style.display = 'grid';
  document.querySelector('.search-wrap').style.display = 'block';
  currentChapter = null;
}

document.getElementById('search').addEventListener('input', (e) => {
  const term = e.target.value.trim().toLowerCase();
  const tiles = document.querySelectorAll('.tile');
  let anyVisible = false;
  tiles.forEach(t => {
    const match = !term || t.dataset.search.includes(term);
    t.classList.toggle('hidden', !match);
    if(match) anyVisible = true;
  });
  document.getElementById('emptyMsg').style.display = anyVisible ? 'none' : 'block';
});

renderGrid();
</script>
